/* ---- Carousel behaviour: 4s per card, loops forever, prev/next beside the card ---- */
function initCarousel(root, count) {
  var INTERVAL = 4000;
  var cards = root.querySelectorAll('.card'),
    prev = root.querySelector('[data-a="prev"]'),
    next = root.querySelector('[data-a="next"]'),
    dots = root.querySelectorAll('.dot');
  var idx = 0, timer = null, hover = false;
  function show(i) {
    idx = (i + count) % count;
    for (var k = 0; k < cards.length; k++) {
      cards[k].classList.toggle('active', k === idx);
      if (dots[k]) dots[k].classList.toggle('active', k === idx);
    }
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } }
  function start() {
    stop();
    if (count > 1 && !hover && !document.hidden) {
      timer = setInterval(function () { show(idx + 1); }, INTERVAL);
    }
  }
  prev.addEventListener('click', function () { show(idx - 1); start(); });
  next.addEventListener('click', function () { show(idx + 1); start(); });
  for (var d = 0; d < dots.length; d++) {
    (function (n) { dots[n].addEventListener('click', function () { show(n); start(); }); })(d);
  }
  root.addEventListener('mouseenter', function () { hover = true; stop(); });
  root.addEventListener('mouseleave', function () { hover = false; start(); });
  root.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { show(idx - 1); start(); }
    else if (e.key === 'ArrowRight') { show(idx + 1); start(); }
  });
  document.addEventListener('visibilitychange', start);
  show(0);
  start();
}
